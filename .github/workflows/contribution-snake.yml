name: Update contribution snake

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/contribution-snake.yml

permissions:
  contents: read

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out profile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate tofu-themed contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/contribution-snake.svg?color_snake=%23D89855&color_dots=%23F1EDE5,%23F5DDAD,%23F2C078,%23D89855,%23A66336
            assets/contribution-snake-dark.svg?palette=github-dark&color_snake=%23FFF0D5&color_dots=%23252C36,%23534438,%23876145,%23BF8956,%23F2C078

      - name: Generate reduced-motion snapshots
        run: python3 scripts/build-pixel-world.py --snake-stills-only

      - name: Publish updated images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/contribution-snake.svg assets/contribution-snake-dark.svg assets/contribution-snake-still-light.svg assets/contribution-snake-still-dark.svg
          if git diff --cached --quiet; then
            echo 'Contribution snakes are already up to date.'
            exit 0
          fi
          git commit -m "docs(profile): refresh contribution snakes"
          git pull --rebase origin main
          git push origin HEAD:main
